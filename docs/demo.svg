<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
  <defs>
    <style>
      .t  { font: 13px/1.5 'Cascadia Code','Consolas',monospace; fill: #c9d1d9; }
      .p  { fill: #7ee787; font-weight: bold; }
      .h  { fill: #8b949e; }
      .i  { fill: #79c0ff; }
      .w  { fill: #e3b341; }
      .f  { fill: #ff7b72; font-weight: bold; }
      .v  { fill: #d2a8ff; font-weight: bold; }
      .d  { fill: #6e7681; }
    </style>
  </defs>
  <!-- window frame -->
  <rect width="980" height="640" rx="8" fill="#0d1117"/>
  <!-- title bar: Windows Terminal style -->
  <rect width="980" height="40" fill="#161b22"/>
  <!-- active tab -->
  <rect x="10" y="6" width="228" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
  <rect x="18" y="16" width="10" height="10" fill="#4d9fff"/>
  <text x="36" y="25" class="t">cmd — spawnfate</text>
  <!-- new-tab + -->
  <text x="248" y="26" class="t" fill="#8b949e" font-size="15">+</text>
  <!-- window controls: minimize / maximize / close (RIGHT side, Windows style) -->
  <g stroke="#c9d1d9" stroke-width="1" fill="none">
    <line x1="886" y1="20" x2="896" y2="20"/>                                  <!-- ─ -->
    <rect x="926" y="15" width="9" height="9"/>                                <!-- ▢ -->
    <line x1="961" y1="15" x2="969" y2="23"/><line x1="969" y1="15" x2="961" y2="23"/> <!-- ✕ -->
  </g>

  <!-- run 1 -->
  <text x="24" y="70"  class="t"><tspan class="p">C:\work&gt;</tspan> spawnfate npx -v</text>
  <text x="24" y="94"  class="t"><tspan class="h">== resolution ==</tspan></text>
  <text x="24" y="114" class="t">  resolved: (none)</text>
  <text x="24" y="134" class="t"><tspan class="h">== findings ==</tspan></text>
  <text x="24" y="154" class="t"><tspan class="i">[info]</tspan> Resolve R1.14/R1.15: "C:\…\nodejs-lts\current\npx" exists but is</text>
  <text x="24" y="174" class="t">        <tspan class="d">invisible to libuv's resolver (no extension, not .com/.exe) — NOT a candidate</tspan></text>
  <text x="24" y="194" class="t"><tspan class="f">[FATAL]</tspan> Resolve R1.14: libuv tried 156 candidates, none exist — ENOENT</text>
  <text x="24" y="214" class="t"><tspan class="h">== verdict ==</tspan></text>
  <text x="24" y="234" class="t"><tspan class="f">  DIES at Resolve: FileNotFound</tspan></text>
  <text x="24" y="258" class="t" fill="#8b949e" font-style="italic">  the shim is right there on PATH — but libuv never even looks for it</text>

  <!-- divider -->
  <line x1="24" y1="282" x2="956" y2="282" stroke="#21262d" stroke-width="1"/>

  <!-- run 2 -->
  <text x="24" y="310" class="t"><tspan class="p">C:\work&gt;</tspan> spawnfate --shell npx -v</text>
  <text x="24" y="334" class="t"><tspan class="h">== resolution ==</tspan></text>
  <text x="24" y="354" class="t">  resolved: C:\…\nodejs-lts\current\npx</text>
  <text x="24" y="374" class="t"><tspan class="h">== serialized command line ==</tspan></text>
  <text x="24" y="394" class="t">  "C:\WINDOWS\system32\cmd.exe" /d /s /c "npx -v"</text>
  <text x="24" y="414" class="t"><tspan class="h">== after cmd re-parse ==</tspan></text>
  <text x="24" y="434" class="t">  npx -v</text>
  <text x="24" y="454" class="t"><tspan class="h">== findings ==</tspan></text>
  <text x="24" y="474" class="t"><tspan class="w">[warn]</tspan> Serialize R1.9: shell:true joins args RAW — DEP0190 territory</text>
  <text x="24" y="494" class="t"><tspan class="i">[info]</tspan> CmdParse R2.3: /s strips outer quotes → effective: npx -v</text>
  <text x="24" y="514" class="t"><tspan class="i">[info]</tspan> Resolve R1.16: cmd re-resolves "npx" → C:\…\nodejs-lts\current\npx</text>
  <text x="24" y="534" class="t"><tspan class="w">[warn]</tspan> Exec R0.5: not a PE — cmd will try it as batch text</text>
  <text x="24" y="554" class="t"><tspan class="h">== verdict ==</tspan></text>
  <text x="24" y="574" class="t"><tspan class="v">  RUNS — target argv: ["npx", "-v"]</tspan></text>
  <text x="24" y="598" class="t" fill="#8b949e" font-style="italic">  same name, different resolver, different fate — cmd finds the bash shim</text>

  <!-- footer strip -->
  <rect x="24" y="612" width="932" height="1" fill="#21262d"/>
  <text x="24" y="632" class="t" fill="#6e7681">three resolvers, three fates — spawnfate shows all of them, before you run</text>
</svg>
